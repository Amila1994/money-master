name: Android APK Build (Fixed Keystore)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Extract Zip & Locate Android Project
        run: |
          if [ -f "money-master.zip" ]; then
            unzip -o money-master.zip
          elif [ -f "classroom-hub.zip" ]; then
            unzip -o classroom-hub.zip
          fi

          BUILD_FILE_PATH=$(find . -name "build.gradle*" -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$BUILD_FILE_PATH" ]; then
            echo "Error: build.gradle file not found in the project!"
            exit 1
          fi

          PROJECT_DIR=$(cd $(dirname "$BUILD_FILE_PATH") && pwd)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found Android project at: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Copy Keystore to All Required Locations
        run: |
          # Root directory එකේ ඇති debug.keystore එක සොයා ගැනීම
          if [ -f "debug.keystore" ]; then
            KEYSTORE_SRC="debug.keystore"
          elif [ -f "app/debug.keystore" ]; then
            KEYSTORE_SRC="app/debug.keystore"
          fi

          if [ -n "$KEYSTORE_SRC" ]; then
            echo "Found keystore at: $KEYSTORE_SRC"
            
            # Gradle එක හොයන හැම තැනටම Copy කිරීම
            mkdir -p ~/.android
            cp "$KEYSTORE_SRC" ~/.android/debug.keystore
            cp "$KEYSTORE_SRC" "${{ env.PROJECT_DIR }}/debug.keystore"
            mkdir -p "${{ env.PROJECT_DIR }}/app"
            cp "$KEYSTORE_SRC" "${{ env.PROJECT_DIR }}/app/debug.keystore"
            
            echo "Keystore copied to all locations successfully!"
          else
            echo "Error: debug.keystore was not found in the repository!"
            exit 1
          fi

      - name: Show Fixed SHA1 Key
        run: |
          KEYSTORE_PATH="${{ env.PROJECT_DIR }}/debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "=========================================="
            echo "       YOUR SHA-1 KEY FOR FIREBASE        "
            echo "=========================================="
            keytool -list -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
            echo "=========================================="
          fi

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classroom-hub-app-debug
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
