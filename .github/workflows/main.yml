Name: Android APK Build (Fixed Keystore)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Locate Keystore File
        run: |
          # Repository එක මුළුල්ලේම debug.keystore File එක සොයා ගැනීම
          KEYSTORE_FOUND=$(find . -name "debug.keystore" | head -n 1)

          if [ -n "$KEYSTORE_FOUND" ]; then
            ABSOLUTE_KEYSTORE=$(realpath "$KEYSTORE_FOUND")
            echo "SAVED_KEYSTORE_PATH=$ABSOLUTE_KEYSTORE" >> $GITHUB_ENV
            echo "Keystore found at: $ABSOLUTE_KEYSTORE"
          else
            echo "Error: debug.keystore was not found in the repository!"
            exit 1
          fi

      - name: Extract Zip & Locate Android Project
        run: |
          if [ -f "money-master.zip" ]; then
            unzip -o money-master.zip
          elif [ -f "classroom-hub.zip" ]; then
            unzip -o classroom-hub.zip
          fi

          BUILD_FILE_PATH=$(find . -name "build.gradle*" -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$BUILD_FILE_PATH" ]; then
            echo "Error: build.gradle file not found in the project!"
            exit 1
          fi

          PROJECT_DIR=$(cd $(dirname "$BUILD_FILE_PATH") && pwd)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found Android project at: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Copy Keystore to All Required Locations
        run: |
          KEYSTORE_SRC="${{ env.SAVED_KEYSTORE_PATH }}"
          
          if [ -f "$KEYSTORE_SRC" ]; then
            echo "Copying keystore from: $KEYSTORE_SRC"
            
            # Gradle එක සොයන ස්ථාන 3ටම Copy කිරීම
            mkdir -p ~/.android
            cp "$KEYSTORE_SRC" ~/.android/debug.keystore
            cp "$KEYSTORE_SRC" "${{ env.PROJECT_DIR }}/debug.keystore"
            mkdir -p "${{ env.PROJECT_DIR }}/app"
            cp "$KEYSTORE_SRC" "${{ env.PROJECT_DIR }}/app/debug.keystore"
            
            echo "Keystore successfully copied to all required locations!"
          else
            echo "Error: Saved keystore path is invalid!"
            exit 1
          fi

      - name: Show Fixed SHA1 & SHA256 Keys for Firebase
        run: |
          KEYSTORE_PATH="${{ env.PROJECT_DIR }}/app/debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "=========================================="
            echo "     YOUR SHA KEYS FOR FIREBASE CONSOLE   "
            echo "=========================================="
            keytool -list -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"
            echo "=========================================="
          fi

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classroom-hub-app-debug
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
