name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Extract Zip & Locate Android Project
        run: |
          if [ -f "money-master.zip" ]; then
            unzip -o money-master.zip
          elif [ -f "classroom-hub.zip" ]; then
            unzip -o classroom-hub.zip
          fi

          BUILD_FILE_PATH=$(find . -name "build.gradle*" -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$BUILD_FILE_PATH" ]; then
            echo "Error: build.gradle file not found in the project!"
            exit 1
          fi

          PROJECT_DIR=$(cd $(dirname "$BUILD_FILE_PATH") && pwd)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found Android project at: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Create Keystore & Show SHA1
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -alias androiddebugkey -keypass android \
            -keystore ~/.android/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 10000 -keyalg RSA -keysize 2048

          # Build එක වන ස්ථාන වලට Copy කිරීම
          cp ~/.android/debug.keystore "${{ env.PROJECT_DIR }}/debug.keystore"
          mkdir -p "${{ env.PROJECT_DIR }}/app"
          cp ~/.android/debug.keystore "${{ env.PROJECT_DIR }}/app/debug.keystore"

          echo "=========================================="
          echo "       YOUR SHA-1 KEY FOR FIREBASE        "
          echo "=========================================="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
          echo "=========================================="

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classroom-hub-app-debug
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: permanent-debug-keystore
          path: ~/.android/debug.keystore
