name: Web App Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract zip if present
        run: |
          if [ -f "money-master.zip" ]; then
            unzip -o money-master.zip
          fi

      - name: Install & Build Web App
        run: |
          npm install
          npm run build
