name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Extract & Setup Project
        run: |
          # Zip එක Extract කිරීම
          if [ -f "money-master.zip" ]; then
            unzip -o money-master.zip
          fi

          # build.gradle හෝ build.gradle.kts තියෙන තැන සෙවීම
          BUILD_FILE_PATH=$(find . -maxdepth 3 -name "build.gradle*" | head -n 1)

          if [ -z "$BUILD_FILE_PATH" ]; then
            echo "Error: build.gradle file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE_PATH")
          cd "$PROJECT_DIR"

          # gradlew file එක නැත්නම් අලුතින් generate කිරීම
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating wrapper..."
            gradle wrapper
          fi

          chmod +x gradlew
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Setup Constant Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048

      - name: Print SHA-1 Key
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: Build with Gradle
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Dorg.jetbrains.kotlin.compiler.runner.kotlin.daemon.ext.impl.backend.fksp=true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
